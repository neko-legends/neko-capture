# Builds the Linux AppImage so Neko Legends Control Center can install this app.
#
# - Push to the `release-test` branch: build and keep the AppImage as a workflow
#   artifact only (nothing is published) for testing.
# - Push a tag like v26.11.9 (on main): build and upload the AppImage to that
#   tag's release (created if missing).
# - Run manually with an existing tag: rebuild the AppImage for that tag.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [release-test]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build the Linux AppImage for
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error

  publish:
    needs: [linux]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true
      - name: Upload assets to the release
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          find assets -type f -print0 | xargs -0 gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber
